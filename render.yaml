# Render Blueprint — one-click deploy of the Prism Accounting System.
#
# In the Render dashboard: New + → Blueprint → connect this repo → Render reads
# this file and provisions everything below. See docs/DEPLOY_RENDER.md for the
# full walkthrough (including the secrets you must set: DATABASE_URL,
# ADMIN_PASSWORD and ANTHROPIC_API_KEY).
#
# What this provisions:
#   • a Dockerized Flask web service (always-on, ~US$7/mo)
#   • a 1 GB persistent disk for uploaded receipts / bill PDFs / the logo ($0.25/mo)
#   • a pre-deploy step that seeds the chart of accounts + first admin user
#
# The database is a FREE external PostgreSQL (Neon, neon.tech) — you paste its
# connection string in as the DATABASE_URL secret. This keeps the monthly cost to
# ~US$7.25 instead of ~US$17.75 with Render's own managed database.

services:
  - type: web
    name: prism-accounting
    runtime: docker
    plan: starter              # ~US$7/mo, always-on. "free" also works but sleeps when idle.
    dockerfilePath: ./Dockerfile
    branch: main                    # the repo's default branch
    autoDeploy: true
    healthCheckPath: /auth/login
    # Runs once before each deploy. seed.py is idempotent: it creates the chart of
    # accounts, currencies, tax rates, cost centers and the first admin only if missing.
    preDeployCommand: "python seed.py"
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: DATABASE_URL              # paste your free Neon connection string (postgresql://...)
        sync: false
      - key: SECRET_KEY
        generateValue: true            # Render generates a strong random key
      - key: UPLOAD_FOLDER
        value: /app/uploads
      - key: PYTHONUNBUFFERED
        value: "1"
      # ---- Secrets you set in the Render dashboard (sync:false = not stored in git) ----
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY          # needed for AI receipt/bill reading
        sync: false
