  <a class="btn btn-sm" href="{{ url_for('reports.export', report_slug=slug, fmt='xlsx') }}{% if request.query_string %}?{{ request.query_string.decode() }}{% endif %}">Excel</a>
  <a class="btn btn-sm" href="{{ url_for('reports.export', report_slug=slug, fmt='pdf') }}{% if request.query_string %}?{{ request.query_string.decode() }}{% endif %}">PDF</a>
